name: Verify release on Windows and Linux
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AI_MODE: demo
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install chromium ffmpeg
      - run: npm run test:e2e
      - run: npm run desktop:dist
      - name: Launch packaged Windows EXE and test restart persistence
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release/bin/win-unpacked/Naucz Pilota.exe'
          npm run desktop:smoke -- --executable "$exe"
      - run: npm run release:check
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Windows-demo-and-verification
          path: |
            release/bin/*.zip
            checks/*.json
            checks/desktop-win32*.png
          retention-days: 7
  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run docker:build
      - run: npm run docker:smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Linux-container-verification
          path: checks/docker-smoke.json
          retention-days: 7
